<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FCP Balloon Catch — ar.rkmviva.org</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#e8f4ff;touch-action:none}
#c{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ct=cv.getContext('2d');
function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
resize();window.addEventListener('resize',()=>{resize();if(state==='play')initClouds();});
const W=()=>cv.width,H=()=>cv.height;
const mob=()=>W()<600;

const POSS=['Being Heroic','Expanding Myself','Living in Harmony','Seeking Perfection','Recognizing the Sacred','Being a Truth Seeker'];
const COMPS={
  'Being Heroic':['Courage to face challenges','Acting with honesty & integrity','Keeping the commitment I make','Obeying from position of strength'],
  'Expanding Myself':['Expanding — Who I am','Expanding purpose of my work','Expanding — Who are my own','Making more unselfish choices','Including others'],
  'Living in Harmony':['Accepting differences with others','Showing respect irrespective of status','Showing concern for others','Sharing responsibilities of community'],
  'Seeking Perfection':['Perfection in what we make','Perfection in process we follow','Perfection in our interactions','Perfection in the role we have'],
  'Recognizing the Sacred':['Being aware of our traditions','Learning value of traditions','Practicing our valued traditions','Respecting others\' traditions','Conscious of democratic traditions','Protecting democratic traditions'],
  'Being a Truth Seeker':['Searching for truth scientifically','Searching for truth in society','Forming opinions based on facts','Not letting stereotypes cloud reality','Finding real reason before reacting','Experimenting before concluding']
};
const BCOLS=[
  {bg:'#FF8FAB',sk:'#c0002a',tx:'#7b0028'},
  {bg:'#74C7FF',sk:'#0055bb',tx:'#003070'},
  {bg:'#6EEBB9',sk:'#089960',tx:'#085c3a'},
  {bg:'#FFD074',sk:'#bb7700',tx:'#6a3000'},
  {bg:'#C9A0FF',sk:'#6600bb',tx:'#380060'},
  {bg:'#FFB347',sk:'#cc6600',tx:'#6a2800'},
];
const Qs=[
  {q:'"Keeping the commitment I make" belongs to which Universal Possibility?',a:'Being Heroic',type:'poss',e:'Keeping commitments with honesty is Being Heroic!'},
  {q:'"Acting with honesty and integrity, irrespective of consequences" — which possibility?',a:'Being Heroic',type:'poss',e:'Honesty regardless of consequences is Being Heroic!'},
  {q:'"Having the courage to face physical, mental or moral challenges" — which?',a:'Being Heroic',type:'poss',e:'Facing all challenges with courage is Being Heroic!'},
  {q:'A student honestly admits his mistake to the teacher even though scared. Which possibility?',a:'Being Heroic',type:'poss',e:'Honesty and courage under pressure is Being Heroic!'},
  {q:'"Strength is life!" — Swami Vivekananda. Which FCP possibility does this inspire?',a:'Being Heroic',type:'poss',e:'Vivekananda\'s call to inner strength awakens Being Heroic!'},
  {q:'Which of these is a component of Being Heroic?',a:'Keeping the commitment I make',poss:'Being Heroic',type:'comp',e:'Keeping commitments is a key component of Being Heroic!'},
  {q:'Which of these belongs to Being Heroic?',a:'Acting with honesty & integrity',poss:'Being Heroic',type:'comp',e:'Acting with honesty and integrity is the heart of Being Heroic!'},
  {q:'Which of these is a component of Being Heroic?',a:'Obeying from position of strength',poss:'Being Heroic',type:'comp',e:'Obeying from inner strength, not fear, is Being Heroic!'},
  {q:'"By expanding — Who I am" is a component of which Universal Possibility?',a:'Expanding Myself',type:'poss',e:'Growing who we are, our purpose and circle is Expanding Myself!'},
  {q:'"By expanding the purpose of my work" — which Universal Possibility?',a:'Expanding Myself',type:'poss',e:'Growing the purpose of what we do is Expanding Myself!'},
  {q:'A girl starts caring for her whole school community, not just her class. Which possibility?',a:'Expanding Myself',type:'poss',e:'Widening our circle of concern is Expanding Myself!'},
  {q:'"Making more unselfish choices and including others" — which Universal Possibility?',a:'Expanding Myself',type:'poss',e:'Being unselfish and including others is Expanding Myself!'},
  {q:'Which of these is a component of Expanding Myself?',a:'Expanding — Who are my own',poss:'Expanding Myself',type:'comp',e:'Widening who we consider as our own is Expanding Myself!'},
  {q:'Which of these belongs to Expanding Myself?',a:'Making more unselfish choices',poss:'Expanding Myself',type:'comp',e:'Making unselfish choices is a key part of Expanding Myself!'},
  {q:'Which of these is a component of Expanding Myself?',a:'Expanding purpose of my work',poss:'Expanding Myself',type:'comp',e:'Expanding the purpose of our work is Expanding Myself!'},
  {q:'"Accepting the differences with others" belongs to which Universal Possibility?',a:'Living in Harmony',type:'poss',e:'Accepting all differences is the foundation of Living in Harmony!'},
  {q:'"Showing respect irrespective of status" — which Universal Possibility?',a:'Living in Harmony',type:'poss',e:'Respecting everyone equally is Living in Harmony!'},
  {q:'"Showing concern for others" — which Universal Possibility?',a:'Living in Harmony',type:'poss',e:'Genuinely caring for others is Living in Harmony!'},
  {q:'"Sharing the responsibilities of the community" — which Universal Possibility?',a:'Living in Harmony',type:'poss',e:'Sharing community responsibilities is Living in Harmony!'},
  {q:'A boy respectfully befriends a classmate from a completely different culture. Which?',a:'Living in Harmony',type:'poss',e:'Going beyond cultural differences with respect is Living in Harmony!'},
  {q:'Which of these is a component of Living in Harmony?',a:'Accepting differences with others',poss:'Living in Harmony',type:'comp',e:'Accepting all differences is a core component of Living in Harmony!'},
  {q:'Which of these belongs to Living in Harmony?',a:'Showing concern for others',poss:'Living in Harmony',type:'comp',e:'Showing genuine concern for others is Living in Harmony!'},
  {q:'Which of these is a component of Living in Harmony?',a:'Sharing responsibilities of community',poss:'Living in Harmony',type:'comp',e:'Sharing community responsibilities is Living in Harmony!'},
  {q:'"Perfection in what we make" is a component of which Universal Possibility?',a:'Seeking Perfection',type:'poss',e:'Excellence in everything we create is Seeking Perfection!'},
  {q:'"Perfection in the process or method we follow" — which Universal Possibility?',a:'Seeking Perfection',type:'poss',e:'Doing things the right and best way is Seeking Perfection!'},
  {q:'"Perfection in our interactions with others" — which Universal Possibility?',a:'Seeking Perfection',type:'poss',e:'Being excellent in how we treat others is Seeking Perfection!'},
  {q:'A student keeps improving her painting every day with full dedication. Which possibility?',a:'Seeking Perfection',type:'poss',e:'Continuously improving towards excellence is Seeking Perfection!'},
  {q:'Which of these is a component of Seeking Perfection?',a:'Perfection in what we make',poss:'Seeking Perfection',type:'comp',e:'Perfection in what we create is Seeking Perfection!'},
  {q:'Which of these belongs to Seeking Perfection?',a:'Perfection in our interactions',poss:'Seeking Perfection',type:'comp',e:'Perfection in interactions with others is Seeking Perfection!'},
  {q:'Which of these is a component of Seeking Perfection?',a:'Perfection in the role we have',poss:'Seeking Perfection',type:'comp',e:'Excelling in every role we have is Seeking Perfection!'},
  {q:'"Being aware of the important traditions of our family, state and country" — which?',a:'Recognizing the Sacred',type:'poss',e:'Knowing and honouring our traditions is Recognizing the Sacred!'},
  {q:'"Practicing the traditions we have accepted as valuable" — which Universal Possibility?',a:'Recognizing the Sacred',type:'poss',e:'Living our valued traditions is Recognizing the Sacred!'},
  {q:'"Becoming conscious of India\'s democratic traditions" — which possibility?',a:'Recognizing the Sacred',type:'poss',e:'Valuing our democratic traditions is Recognizing the Sacred!'},
  {q:'Students celebrate their school\'s cultural festival with great pride. Which possibility?',a:'Recognizing the Sacred',type:'poss',e:'Celebrating cultural heritage is Recognizing the Sacred!'},
  {q:'Which of these is a component of Recognizing the Sacred?',a:'Practicing our valued traditions',poss:'Recognizing the Sacred',type:'comp',e:'Practising our valued traditions is Recognizing the Sacred!'},
  {q:'Which of these belongs to Recognizing the Sacred?',a:'Protecting democratic traditions',poss:'Recognizing the Sacred',type:'comp',e:'Protecting democratic traditions is Recognizing the Sacred!'},
  {q:'Which of these is a component of Recognizing the Sacred?',a:'Conscious of democratic traditions',poss:'Recognizing the Sacred',type:'comp',e:'Being conscious of our democratic traditions is Recognizing the Sacred!'},
  {q:'"Searching for truth scientifically" belongs to which Universal Possibility?',a:'Being a Truth Seeker',type:'poss',e:'Searching for truth through science is Being a Truth Seeker!'},
  {q:'"Forming opinions based on sound reasoning and facts" — which possibility?',a:'Being a Truth Seeker',type:'poss',e:'Using reason and facts to form opinions is Being a Truth Seeker!'},
  {q:'"Not letting stereotypes cloud reality" — which Universal Possibility?',a:'Being a Truth Seeker',type:'poss',e:'Looking beyond stereotypes to find truth is Being a Truth Seeker!'},
  {q:'"Finding the real reason before you react" — which Universal Possibility?',a:'Being a Truth Seeker',type:'poss',e:'Seeking real reasons before reacting is Being a Truth Seeker!'},
  {q:'A student always checks the facts carefully before forming an opinion. Which possibility?',a:'Being a Truth Seeker',type:'poss',e:'Basing opinions on facts is Being a Truth Seeker!'},
  {q:'Which of these is a component of Being a Truth Seeker?',a:'Searching for truth scientifically',poss:'Being a Truth Seeker',type:'comp',e:'Scientific truth seeking is Being a Truth Seeker!'},
  {q:'Which of these belongs to Being a Truth Seeker?',a:'Not letting stereotypes cloud reality',poss:'Being a Truth Seeker',type:'comp',e:'Looking beyond stereotypes is Being a Truth Seeker!'},
  {q:'Which of these is a component of Being a Truth Seeker?',a:'Forming opinions based on facts',poss:'Being a Truth Seeker',type:'comp',e:'Forming opinions on facts is Being a Truth Seeker!'},
];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getOpts(q){
  if(q.type==='poss') return shuffle([...POSS]);
  const others=POSS.filter(p=>p!==q.poss);
  const wrongs=others.map(p=>{const c=COMPS[p];return c[Math.floor(Math.random()*c.length)];});
  return shuffle([q.a,...wrongs]);
}

let state='idle',score=0,hearts=3,qIdx=0,hi=0,fr=0;
let rocketX,targetX;
let balloons=[],particles=[],bgClouds=[];
let answered=false,fbText='',fbColor='',fbTimer=0;
let shuffledQs=[],idleBalloons=[];

const keys={L:false,R:false};
window.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') keys.L=true;
  if(e.code==='ArrowRight'||e.code==='KeyD') keys.R=true;
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(state!=='play') go();}
});
window.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') keys.L=false;
  if(e.code==='ArrowRight'||e.code==='KeyD') keys.R=false;
});
cv.addEventListener('click',e=>{if(state!=='play'){go();return;}targetX=Math.max(10,Math.min(W()-getRW()-10,e.clientX-getRW()/2));});
cv.addEventListener('touchstart',e=>{e.preventDefault();if(state!=='play'){go();return;}targetX=Math.max(10,Math.min(W()-getRW()-10,e.touches[0].clientX-getRW()/2));},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(state!=='play')return;targetX=Math.max(10,Math.min(W()-getRW()-10,e.touches[0].clientX-getRW()/2));},{passive:false});

function getRW(){return Math.min(40,W()*0.055);}
function getBR(){return Math.min(38,W()*0.05);}

function go(){
  shuffledQs=shuffle([...Qs]);
  state='play';score=0;hearts=3;qIdx=0;fr=0;
  rocketX=W()/2-getRW()/2;targetX=rocketX;
  balloons=[];particles=[];answered=false;fbTimer=0;
  initClouds();spawnQ();
}

function initClouds(){
  bgClouds=[];
  for(let i=0;i<8;i++) bgClouds.push({x:Math.random()*W(),y:15+Math.random()*H()*0.22,w:45+Math.random()*60,spd:0.1+Math.random()*0.13});
}

function initIdleBalloons(){
  idleBalloons=POSS.map((p,i)=>({
    x:W()/(POSS.length)*(i+0.5),
    y:H()*0.52+Math.sin(i*1.2)*30,
    r:Math.min(44,W()*0.065),
    label:p,c:BCOLS[i],
    wob:i*1.1,ws:0.012+i*0.003,
    vy:-0.3
  }));
}

function spawnQ(){
  if(qIdx>=shuffledQs.length){state='win';hi=Math.max(hi,score);return;}
  answered=false;
  const q=shuffledQs[qIdx];
  const opts=getOpts(q);
  const r=getBR();
  const sp=W()/6;
  balloons=opts.map((opt,i)=>({
    x:sp*i+sp/2,y:-r*2.5-Math.random()*H()*0.2,
    vy:Math.max(0.5,Math.min(1.4,H()*0.0011))*(0.85+Math.random()*0.3),
    label:opt,c:BCOLS[i%6],r,
    correct:opt===q.a,caught:false,
    wob:Math.random()*Math.PI*2,ws:0.015+Math.random()*0.013
  }));
}

function nextQ(){qIdx++;spawnQ();}

function burst(x,y,col,n){
  for(let i=0;i<(n||8);i++){
    const a=i/(n||8)*Math.PI*2,s=2.5+Math.random()*2.5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,life:45,col});
  }
}

function getBasket(){
  const rw=getRW(),sc=rw/16,rx=rocketX+rw/2;
  const ry=H()-H()*0.05-rw*2;
  return{cx:rx,y:ry-26*sc,l:rx-20*sc,r:rx+20*sc};
}

function drawBG(){
  ct.fillStyle='#e8f4ff';ct.fillRect(0,0,W(),H());
  for(const c of bgClouds){
    c.x+=c.spd;if(c.x>W()+130)c.x=-130;
    ct.fillStyle='rgba(255,255,255,0.82)';
    [[0.3,0,0.2],[0.6,3,0.16],[0.08,4,0.14],[0.36,0.16,0.19]].forEach(([fx,fy,fr])=>{
      ct.beginPath();ct.arc(c.x+c.w*fx,c.y+c.w*fy,c.w*fr,0,Math.PI*2);ct.fill();
    });
  }
  ct.fillStyle='#b8e090';ct.fillRect(0,H()-H()*0.05,W(),H()*0.05);
  ct.fillStyle='#90c870';ct.fillRect(0,H()-H()*0.05,W(),H()*0.013);
  ct.fillStyle='#70b050';
  for(let x=0;x<W();x+=18){ct.fillRect(x+2,H()-H()*0.05-4,3,5);ct.fillRect(x+9,H()-H()*0.05-6,3,7);}
}

function drawBalloon(b,showLabel){
  if(b.caught)return;
  b.wob+=b.ws;
  const wx=Math.sin(b.wob)*2.2,cx=b.x+wx,cy=b.y;
  ct.fillStyle=b.c.bg;ct.strokeStyle=b.c.sk;ct.lineWidth=2;
  ct.beginPath();ct.ellipse(cx,cy,b.r,b.r*1.1,0,0,Math.PI*2);ct.fill();ct.stroke();
  ct.fillStyle='rgba(255,255,255,0.38)';
  ct.beginPath();ct.ellipse(cx-b.r*0.26,cy-b.r*0.28,b.r*0.23,b.r*0.17,-0.3,0,Math.PI*2);ct.fill();
  ct.fillStyle=b.c.bg;ct.strokeStyle=b.c.sk;ct.lineWidth=1.5;
  ct.beginPath();ct.arc(cx,cy+b.r*1.1,3,0,Math.PI*2);ct.fill();ct.stroke();
  ct.strokeStyle='rgba(0,0,0,0.18)';ct.lineWidth=1;
  ct.beginPath();ct.moveTo(cx,cy+b.r*1.1+3);ct.quadraticCurveTo(cx+3,cy+b.r*1.1+12,cx,cy+b.r*1.1+24);ct.stroke();
  if(showMsg===false)return;
  const words=b.label.split(' ');
  const fs=Math.max(8,Math.min(12,b.r*0.3));
  ct.fillStyle=b.c.tx;ct.font=`bold ${fs}px Arial`;ct.textAlign='center';
  const maxW=b.r*1.55;let lines=[],line='';
  for(const w of words){const t=line?line+' '+w:w;if(ct.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;}
  if(line)lines.push(line);
  const lh=fs+2,sy=cy-(lines.length-1)*lh/2;
  lines.slice(0,4).forEach((l,i)=>ct.fillText(l,cx,sy+i*lh));
}
let showMsg=true;

function drawRocket(){
  const rw=getRW(),sc=rw/16,rx=rocketX+rw/2;
  const ry=H()-H()*0.05-rw*2,fl=Math.sin(fr*0.35)*2.5*sc;
  ct.save();ct.translate(rx,ry);ct.scale(sc,sc);
  ct.fillStyle='#ff8800';ct.beginPath();ct.moveTo(-10,34);ct.lineTo(0,52+fl/sc);ct.lineTo(10,34);ct.closePath();ct.fill();
  ct.fillStyle='#ffdd00';ct.beginPath();ct.moveTo(-5,34);ct.lineTo(0,44+fl/sc*0.6);ct.lineTo(5,34);ct.closePath();ct.fill();
  ct.fillStyle='#534AB7';
  ct.beginPath();ct.moveTo(-13,30);ct.lineTo(-21,48);ct.lineTo(-8,35);ct.closePath();ct.fill();
  ct.beginPath();ct.moveTo(13,30);ct.lineTo(21,48);ct.lineTo(8,35);ct.closePath();ct.fill();
  ct.fillStyle='#7F77DD';
  ct.beginPath();if(ct.roundRect)ct.roundRect(-13,-28,26,58,[3,3,2,2]);else ct.rect(-13,-28,26,58);ct.fill();
  ct.fillStyle='#5C35C8';ct.fillRect(-13,4,26,7);
  ct.fillStyle='#AFA9EC';ct.beginPath();ct.moveTo(0,-46);ct.lineTo(-13,-26);ct.lineTo(13,-26);ct.closePath();ct.fill();
  ct.fillStyle='#87ceeb';ct.beginPath();ct.arc(0,-12,7,0,Math.PI*2);ct.fill();
  ct.fillStyle='rgba(255,255,255,0.6)';ct.beginPath();ct.arc(-2,-15,3,0,Math.PI*2);ct.fill();
  ct.fillStyle='#ffd700';ct.font='bold 6px Arial';ct.textAlign='center';ct.fillText('I CAN',0,12);
  ct.strokeStyle='#ffd700';ct.lineWidth=2.5;
  ct.beginPath();ct.moveTo(-20,-28);ct.lineTo(20,-28);ct.stroke();
  ct.fillStyle='rgba(255,215,0,0.18)';ct.fillRect(-20,-28,40,12);
  ct.strokeStyle='rgba(255,215,0,0.4)';ct.lineWidth=1;ct.strokeRect(-20,-28,40,12);
  ct.restore();
  const bk=getBasket();
  ct.strokeStyle='rgba(255,215,0,0.2)';ct.lineWidth=1;ct.setLineDash([4,4]);
  ct.beginPath();ct.moveTo(bk.l,bk.y+12);ct.lineTo(bk.l,H()-H()*0.05);ct.stroke();
  ct.beginPath();ct.moveTo(bk.r,bk.y+12);ct.lineTo(bk.r,H()-H()*0.05);ct.stroke();
  ct.setLineDash([]);
}

function drawHUD(){
  const pad=12,hs=Math.min(22,W()*0.03);
  for(let i=0;i<3;i++){ct.fillStyle=i<hearts?'#e82020':'rgba(0,0,0,0.12)';ct.font=`${hs}px Arial`;ct.textAlign='left';ct.fillText('♥',pad+i*(hs+3),hs+5);}
  ct.fillStyle='#3a2080';ct.font=`bold ${Math.min(14,W()*0.02)}px Arial`;ct.textAlign='right';
  ct.fillText('Score: '+score,W()-pad,hs+5);
  ct.fillStyle='#7c6abf';ct.font=`${Math.min(12,W()*0.016)}px Arial`;ct.textAlign='center';
  ct.fillText('Q '+(qIdx+1)+' / '+shuffledQs.length,W()/2,18);
  const pw=W()*0.34,ph=5,px=(W()-pw)/2,py=23;
  ct.fillStyle='rgba(0,0,0,0.08)';ct.beginPath();if(ct.roundRect)ct.roundRect(px,py,pw,ph,3);else ct.rect(px,py,pw,ph);ct.fill();
  if(qIdx>0){ct.fillStyle='#7F77DD';ct.beginPath();if(ct.roundRect)ct.roundRect(px,py,pw*(qIdx/shuffledQs.length),ph,3);else ct.rect(px,py,pw*(qIdx/shuffledQs.length),ph);ct.fill();}
}

function wrapLine(text,maxW,fs){
  ct.font=`bold ${fs}px Arial`;
  const words=text.split(' ');let line='',lines=[];
  for(const w of words){const t=line?line+' '+w:w;if(ct.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;}
  if(line)lines.push(line);return lines;
}

function drawQuestion(){
  if(qIdx>=shuffledQs.length)return;
  const q=shuffledQs[qIdx];
  const qw=Math.min(W()-20,700),qx=(W()-qw)/2,qy=36;
  ct.fillStyle='rgba(255,255,255,0.97)';ct.strokeStyle='#c5d5ff';ct.lineWidth=2;
  ct.beginPath();if(ct.roundRect)ct.roundRect(qx,qy,qw,88,12);else ct.rect(qx,qy,qw,88);ct.fill();ct.stroke();
  const bBg=q.type==='comp'?'#fff3e0':'#eef2ff';
  const bTx=q.type==='comp'?'#bf6000':'#534AB7';
  const bLabel=q.type==='comp'?'Component question':'Possibility question';
  ct.fillStyle=bBg;ct.strokeStyle=bTx;ct.lineWidth=1;
  ct.beginPath();if(ct.roundRect)ct.roundRect(qx+10,qy+7,130,19,10);else ct.rect(qx+10,qy+7,130,19);ct.fill();ct.stroke();
  ct.fillStyle=bTx;ct.font='bold 9px Arial';ct.textAlign='left';ct.fillText(bLabel,qx+16,qy+20);
  // Bigger font on mobile
  const fs=mob()?Math.max(14,Math.min(17,W()*0.04)):Math.max(13,Math.min(16,W()*0.022));
  const lines=wrapLine(q.q,qw-24,fs);
  ct.fillStyle='#1a1060';ct.font=`bold ${fs}px Arial`;ct.textAlign='center';
  const lh=fs*1.3,sy=qy+38+(lines.length===1?8:0);
  lines.slice(0,3).forEach((l,i)=>ct.fillText(l,W()/2,sy+i*lh));
}

function drawFeedback(){
  if(fbTimer<=0)return;fbTimer--;
  ct.save();ct.globalAlpha=Math.min(1,fbTimer/18);
  const fw=Math.min(W()-20,560),fh=mob()?58:50,fx=(W()-fw)/2,fy=H()/2-fh/2;
  ct.fillStyle=fbColor==='g'?'#e8f8f0':'#fff0f0';
  ct.strokeStyle=fbColor==='g'?'#5DCAA5':'#F0997B';ct.lineWidth=2;
  ct.beginPath();if(ct.roundRect)ct.roundRect(fx,fy,fw,fh,10);else ct.rect(fx,fy,fw,fh);ct.fill();ct.stroke();
  const fs=mob()?Math.max(12,Math.min(15,W()*0.038)):Math.max(11,Math.min(14,W()*0.018));
  ct.fillStyle=fbColor==='g'?'#0F6E56':'#993C1D';ct.font=`bold ${fs}px Arial`;ct.textAlign='center';
  const ls=wrapLine(fbText,fw-20,fs);
  ls.slice(0,2).forEach((l,i)=>ct.fillText(l,W()/2,fy+20+i*(fs+4)));
  ct.restore();
}

function drawParts(){
  for(const p of particles){
    ct.globalAlpha=p.life/45;ct.fillStyle=p.col;
    ct.beginPath();ct.arc(p.x,p.y,4,0,Math.PI*2);ct.fill();
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life--;
  }
  ct.globalAlpha=1;particles=particles.filter(p=>p.life>0);
}

function checkCatch(){
  if(answered)return;
  const bk=getBasket();
  for(const b of balloons){
    if(b.caught)continue;
    const wx=Math.sin(b.wob)*2.2,bCX=b.x+wx,bBot=b.y+b.r*1.1+24;
    if(bBot>=bk.y&&bBot<=bk.y+20&&bCX>=bk.l-6&&bCX<=bk.r+6){
      b.caught=true;answered=true;
      if(b.correct){
        score+=50;fbText='✅ '+shuffledQs[qIdx].e;fbColor='g';
        burst(bCX,b.y,b.c.bg,16);fbTimer=120;
        setTimeout(nextQ,2600);
      } else {
        hearts--;fbText='❌ Answer: '+shuffledQs[qIdx].a;fbColor='r';
        burst(bCX,b.y,'#ff8080',10);fbTimer=120;
        // Wrong — skip this question, never ask again
        if(hearts<=0){setTimeout(()=>{state='over';hi=Math.max(hi,score);},1600);}
        else setTimeout(nextQ,2600);
      }
      return;
    }
  }
  const allGone=balloons.every(b=>b.caught||b.y-b.r>H());
  if(allGone&&!answered){
    answered=true;hearts--;
    fbText='💨 Missed! Answer: '+shuffledQs[qIdx].a;fbColor='r';fbTimer=100;
    // Missed — skip this question, never ask again
    if(hearts<=0){setTimeout(()=>{state='over';hi=Math.max(hi,score);},1600);}
    else setTimeout(nextQ,2400);
  }
}

// ---- IDLE SCREEN ----
function drawIdle(){
  drawBG();fr++;
  if(idleBalloons.length===0) initIdleBalloons();
  // Floating balloons in background
  idleBalloons.forEach((b,i)=>{
    b.wob+=b.ws;b.y+=Math.sin(fr*0.02+i)*0.4;
    if(b.y<H()*0.35) b.y=H()*0.35;
    if(b.y>H()*0.72) b.y=H()*0.72;
    drawBalloon(b,true);
  });
  // Title card
  const cx=W()/2,cy=H()*0.18;
  const cw=Math.min(W()-24,580),ch=mob()?120:100;
  ct.fillStyle='rgba(255,255,255,0.95)';ct.strokeStyle='#c5d5ff';ct.lineWidth=2;
  ct.beginPath();if(ct.roundRect)ct.roundRect(cx-cw/2,cy-ch/2,cw,ch,18);else ct.rect(cx-cw/2,cy-ch/2,cw,ch);ct.fill();ct.stroke();
  ct.fillStyle='#3a2080';ct.font=`bold ${Math.min(mob()?22:26,W()*0.038)}px Arial`;ct.textAlign='center';
  ct.fillText('🎈 FCP Balloon Catch',cx,cy-ch/2+38);
  ct.fillStyle='#7c6abf';ct.font=`${Math.min(mob()?13:14,W()*0.022)}px Arial`;
  ct.fillText('Catch the correct balloon with your rocket!',cx,cy-ch/2+62);
  ct.fillStyle='#555';ct.font=`${Math.min(mob()?11:12,W()*0.018)}px Arial`;
  ct.fillText('Arrow keys / tap to move  ·  6 Universal Possibilities',cx,cy-ch/2+82);
  // START button
  const bw=mob()?180:220,bh=mob()?46:50,bx=cx-bw/2,by=H()*0.82;
  ct.fillStyle='#5C35C8';
  ct.beginPath();if(ct.roundRect)ct.roundRect(bx,by,bw,bh,28);else ct.rect(bx,by,bw,bh);ct.fill();
  ct.fillStyle='#fff';ct.font=`bold ${mob()?16:18}px Arial`;ct.textAlign='center';
  ct.fillText('▶  Tap to Start!',cx,by+bh/2+6);
  // Arrow hint
  ct.fillStyle='rgba(100,80,180,0.5)';ct.font=`${Math.min(11,W()*0.015)}px Arial`;ct.textAlign='center';
  ct.fillText('◀ arrow keys ▶  or  click / tap to move rocket',cx,H()*0.93);
}

// ---- END SCREENS ----
function drawEndScreen(title,sub,score_,note,btn,tc,bc){
  drawBG();fr++;
  const cx=W()/2,cy=H()/2;
  const bw=Math.min(W()-24,560),bh=Math.min(H()-50,360);
  ct.fillStyle='rgba(255,255,255,0.97)';ct.strokeStyle=bc||'#c5d5ff';ct.lineWidth=2.5;
  ct.beginPath();if(ct.roundRect)ct.roundRect(cx-bw/2,cy-bh/2,bw,bh,20);else ct.rect(cx-bw/2,cy-bh/2,bw,bh);ct.fill();ct.stroke();
  ct.fillStyle=tc||'#3a2080';ct.font=`bold ${Math.min(mob()?20:26,W()*0.036)}px Arial`;ct.textAlign='center';
  ct.fillText(title,cx,cy-bh/2+52);
  ct.fillStyle='#555';ct.font=`bold ${Math.min(mob()?15:18,W()*0.025)}px Arial`;
  ct.fillText(score_,cx,cy-bh/2+88);
  ct.fillStyle='#7c6abf';ct.font=`italic ${Math.min(mob()?12:13,W()*0.018)}px Arial`;
  ct.fillText('"'+sub+'"',cx,cy-bh/2+124);
  ct.fillStyle='#aaa';ct.font=`${Math.min(10,W()*0.015)}px Arial`;
  ct.fillText('— Swami Vivekananda',cx,cy-bh/2+144);
  ct.fillStyle='#444';ct.font=`${Math.min(mob()?12:13,W()*0.018)}px Arial`;
  ct.fillText(note,cx,cy-bh/2+176);
  // Restart button
  const bw2=mob()?180:220,bh2=mob()?44:48,bx=cx-bw2/2,by=cy+bh/2-68;
  ct.fillStyle='#5C35C8';
  ct.beginPath();if(ct.roundRect)ct.roundRect(bx,by,bw2,bh2,26);else ct.rect(bx,by,bw2,bh2);ct.fill();
  ct.fillStyle='#fff';ct.font=`bold ${mob()?14:16}px Arial`;ct.textAlign='center';
  ct.fillText(btn,cx,by+bh2/2+6);
}

function loop(){
  ct.clearRect(0,0,W(),H());
  if(state==='idle'){drawIdle();requestAnimationFrame(loop);return;}
  if(state==='over'){
    drawEndScreen('Game Over! 💪','Every failure is a step to success!','Score: '+score+'   Best: '+hi,'Keep going — you are learning!','▶  Play Again',  '#e82020','#ffb3b3');
    requestAnimationFrame(loop);return;
  }
  if(state==='win'){
    drawEndScreen('🎉 You Won!','Arise, Awake, Stop not till the goal is reached!','Score: '+score+'   Best: '+hi,'You mastered all 6 Universal Possibilities! ✓','▶  Play Again','#1D9E75','#6EEBB9');
    requestAnimationFrame(loop);return;
  }
  fr++;
  if(keys.L) targetX=Math.max(10,targetX-5);
  if(keys.R) targetX=Math.min(W()-getRW()-10,targetX+5);
  rocketX+=(targetX-rocketX)*0.16;
  balloons.forEach(b=>{if(!b.caught)b.y+=b.vy;});
  checkCatch();
  drawBG();
  balloons.forEach(b=>drawBalloon(b,true));
  drawRocket();
  drawParts();
  drawHUD();
  drawQuestion();
  drawFeedback();
  requestAnimationFrame(loop);
}
initClouds();loop();
</script>
