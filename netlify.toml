[build]
  publish = "."
  functions = "netlify/functions"

# Front-end calls POST /api/ask — this routes it to the serverless function
# netlify/functions/ask-swamiji.js (kept as a clean, stable path instead of
# exposing /.netlify/functions/... directly in the app code).
[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask-swamiji"
  status = 200
  force = true

# Visitor accounts: sign up, log in, fetch current user, save progress.
# These talk to a NEW, separate database table (vivekmarg_users) — see
# schema_vivekmarg_users.sql — not the internal staff/RP users table.
[[redirects]]
  from = "/api/signup"
  to = "/.netlify/functions/vm-signup"
  status = 200
  force = true

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/vm-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/vm-me"
  status = 200
  force = true

[[redirects]]
  from = "/api/progress"
  to = "/.netlify/functions/vm-progress"
  status = 200
  force = true

# 21-Day Challenge: real content (day titles/prompts) + per-user
# reflections, stored in proper database tables instead of a JSON blob.
[[redirects]]
  from = "/api/challenge-days"
  to = "/.netlify/functions/vm-challenge-days"
  status = 200
  force = true

[[redirects]]
  from = "/api/reflections"
  to = "/.netlify/functions/vm-reflections"
  status = 200
  force = true
